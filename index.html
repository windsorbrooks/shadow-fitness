@keyframes sysIn { 0% { opacity: 0; transform: translateY(-14px) scaleY(.6); filter: blur(3px) } 35% { opacity: 1; transform: translateY(0) scaleY(1.04) skewX(-4deg); filter: blur(0) } 45% { transform: skewX(3deg); clip-path: inset(10% 0 40% 0) } 55% { transform: none; clip-path: inset(0 0 0 0) } 100% { opacity: 1; transform: none } }
@keyframes tabIn { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
@keyframes shimmer { 0% { transform: translateX(-100%) } 100% { transform: translateX(250%) } }
@keyframes pulseGlow { 0%,100% { box-shadow: 0 0 14px rgba(59,108,255,.45), inset 0 0 18px rgba(155,92,255,.15) } 50% { box-shadow: 0 0 22px rgba(106,165,255,.7), inset 0 0 24px rgba(155,92,255,.25) } }
@keyframes ovIn { 0% { opacity: 0 } 100% { opacity: 1 } }
@keyframes bigIn { 0% { opacity: 0; transform: scale(2.2); letter-spacing: 30px; filter: blur(8px) } 60% { opacity: 1; transform: scale(.96); filter: blur(0) } 100% { transform: scale(1); letter-spacing: 6px } }
@keyframes ring { 0% { transform: scale(.2); opacity: .9 } 100% { transform: scale(2.6); opacity: 0 } }
@keyframes rays { from { transform: rotate(0) } to { transform: rotate(360deg) } }
@keyframes achIn { 0% { opacity: 0; transform: rotateX(90deg) scale(.8) } 60% { opacity: 1; transform: rotateX(-10deg) scale(1.03) } 100% { transform: none } }
@keyframes pop { 0% { transform: scale(1) } 40% { transform: scale(1.06); background: rgba(93,255,176,.12) } 100% { transform: scale(1) } }
@keyframes checkIn { 0% { transform: scale(0) rotate(-30deg) } 70% { transform: scale(1.4) } 100% { transform: scale(1) } }
@keyframes flicker { 0%,100% { opacity: 1 } 92% { opacity: 1 } 93% { opacity: .55 } 94% { opacity: 1 } 97% { opacity: .7 } }
.sf-root { font-family: -apple-system, "SF Pro Text", BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.sf-display { font-family: "Avenir Next Condensed", "DIN Condensed", "Arial Narrow", "Roboto Condensed", -apple-system, sans-serif; font-weight: 700; text-transform: uppercase; }
.sys-panel { position: relative; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); background: linear-gradient(160deg, rgba(20,32,78,.78), rgba(10,14,40,.82)) !important; animation: pulseGlow 6s ease-in-out infinite; }
.sys-panel::before, .sys-panel::after { content: ""; position: absolute; width: 14px; height: 14px; border: 2px solid #9fd0ff; pointer-events: none; filter: drop-shadow(0 0 4px #6aa5ff); }
.sys-panel::before { top: -3px; left: -3px; border-right: 0; border-bottom: 0; }
.sys-panel::after { bottom: -3px; right: -3px; border-left: 0; border-top: 0; }
.sys-notif { animation: sysIn .55s cubic-bezier(.2,.9,.3,1.2) both, pulseGlow 3s ease-in-out infinite; }
.sys-notif .sf-h { animation: flicker 2.5s linear infinite; }
.tab-in { animation: tabIn .32s ease-out both; }
.sf-root button { transition: transform .08s ease, box-shadow .2s ease, filter .2s; -webkit-tap-highlight-color: transparent; }
.sf-root button:active:not(:disabled) { transform: scale(.94); filter: brightness(1.3); box-shadow: 0 0 16px rgba(106,165,255,.8); }
.sf-root input:focus, .sf-root select:focus { outline: none; border-color: #6aa5ff !important; box-shadow: 0 0 10px rgba(106,165,255,.6); }
.xp-fill { position: relative; overflow: hidden; transition: width .9s cubic-bezier(.2,.8,.2,1) !important; }
.xp-fill::after { content: ""; position: absolute; inset: 0; width: 40%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); animation: shimmer 2.2s ease-in-out infinite; }
.q-done { animation: pop .45s ease; }
.q-check { display: inline-block; animation: checkIn .4s cubic-bezier(.2,.9,.3,1.5); }
.sf-ov { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; flex-direction: column; background: radial-gradient(circle, rgba(40,20,110,.85), rgba(3,5,15,.96)); animation: ovIn .3s ease both; padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom); text-align: center; }
.sf-ov .big { font-size: 46px; color: #e6f0ff; text-shadow: 0 0 12px #6aa5ff, 0 0 30px #9b5cff; animation: bigIn .9s cubic-bezier(.2,.9,.3,1) both; }
.sf-ov .ring { position: absolute; width: 240px; height: 240px; border-radius: 50%; border: 2px solid #6aa5ff; animation: ring 1.6s ease-out infinite; }
.sf-ov .ring.r2 { animation-delay: .5s; border-color: #9b5cff; }
.sf-ov .rays { position: absolute; width: 700px; height: 700px; background: repeating-conic-gradient(rgba(106,165,255,.10) 0 6deg, transparent 6deg 18deg); border-radius: 50%; animation: rays 18s linear infinite; mask-image: radial-gradient(circle, #000 20%, transparent 65%); -webkit-mask-image: radial-gradient(circle, #000 20%, transparent 65%); }
.sf-ov .rankL { font-size: 120px; line-height: 1; color: #c9a8ff; text-shadow: 0 0 20px #9b5cff, 0 0 60px #9b5cff; animation: bigIn 1.1s cubic-bezier(.2,.9,.3,1) both; }
