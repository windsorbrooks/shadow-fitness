@keyframes sysIn { 0% { opacity: 0; transform: translateY(-14px) scaleY(.6); filter: blur(3px) } 35% { opacity: 1; transform: translateY(0) scaleY(1.04) skewX(-4deg); filter: blur(0) } 45% { transform: skewX(3deg); clip-path: inset(10% 0 40% 0) } 55% { transform: none; clip-path: inset(0 0 0 0) } 100% { opacity: 1; transform: none } }

@keyframes shimmer { 0% { transform: translateX(-100%) } 100% { transform: translateX(250%) } }
@keyframes pulseGlow { 0%,100% { box-shadow: 0 0 14px rgba(59,108,255,.45), inset 0 0 18px rgba(155,92,255,.15) } 50% { box-shadow: 0 0 22px rgba(106,165,255,.7), inset 0 0 24px rgba(155,92,255,.25) } }

@keyframes rays { from { transform: rotate(0) } to { transform: rotate(360deg) } }

.sf-root { font-family: -apple-system, "SF Pro Text", BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.sf-display { font-family: "Avenir Next Condensed", "DIN Condensed", "Arial Narrow", "Roboto Condensed", -apple-system, sans-serif; font-weight: 700; text-transform: uppercase; }
.sys-panel { position: relative; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); background: linear-gradient(160deg, rgba(20,32,78,.78), rgba(10,14,40,.82)) !important; animation: pulseGlow 6s ease-in-out infinite; }

.sys-panel::before { top: -3px; left: -3px; border-right: 0; border-bottom: 0; }
.sys-panel::after { bottom: -3px; right: -3px; border-left: 0; border-top: 0; }
.sys-notif { animation: sysIn .55s cubic-bezier(.2,.9,.3,1.2) both, pulseGlow 3s ease-in-out infinite; }

.tab-in { animation: tabIn .32s ease-out both; }

.xp-fill::after { content: ""; position: absolute; inset: 0; width: 40%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); animation: shimmer 2.2s ease-in-out infinite; }
